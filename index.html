<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MirrorActu: Today, reflected. Tomorrow, remembered.</title>
    <meta name="description" content="MirrorActu shows what happened, what is confirmed, what is still open and where it came from." />
    <meta name="theme-color" content="#0e1424" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!--
      First-load splash. It is plain HTML and CSS so the logo is on screen before any JavaScript
      arrives. src/lib/boot.ts fades it out once the app has mounted.
      Its React twin is BrandSplash in src/components/loading/Loading.tsx: keep the two in step.
    -->
    <style>
      html { background: #0e1424; }
      body { margin: 0; }
      #boot {
        position: fixed; inset: 0; z-index: 80;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0e1424; color: #fff;
        font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
        transition: opacity 0.32s cubic-bezier(0.23, 1, 0.32, 1);
      }
      #boot.boot-out { opacity: 0; pointer-events: none; }
      #boot .row { display: flex; align-items: center; gap: 16px; }
      #boot svg { width: 72px; height: 72px; overflow: visible; }
      #boot .word { font-size: 46px; font-weight: 800; line-height: 0.9; letter-spacing: -0.035em; white-space: nowrap; }
      #boot .word b { color: #ff5a36; font-weight: 800; }
      #boot .tag { margin: 20px 0 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 20px; color: #aeb8c6; }
      #boot .bar { margin-top: 28px; width: 160px; height: 2px; overflow: hidden; background: #1a2236; }
      #boot .bar i { display: block; width: 33%; height: 100%; background: #ff5a36; animation: boot-bar 1.1s ease-in-out infinite; }
      #boot .l, #boot .r, #boot .axis, #boot .dot, #boot .word, #boot .tag {
        opacity: 0; animation: boot-in 0.28s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }
      #boot .l { --x: -10px; animation-delay: 0.05s; }
      #boot .r { --x: 10px; animation-delay: 0.15s; }
      #boot .axis { animation-delay: 0.3s; }
      #boot .dot { --y: -15px; animation-delay: 0.4s; }
      #boot .word { --x: -6px; animation-delay: 0.45s; }
      #boot .tag { animation-delay: 0.55s; }
      @keyframes boot-in {
        from { opacity: 0; transform: translate(var(--x, 0), var(--y, 0)); }
        to { opacity: 1; transform: none; }
      }
      @keyframes boot-bar {
        from { transform: translateX(-100%); }
        to { transform: translateX(300%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot * { animation-duration: 0s !important; animation-delay: 0s !important; }
        #boot .bar { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading MirrorActu">
      <div class="row">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <pattern id="boot-scan" width="100" height="5" patternUnits="userSpaceOnUse">
              <rect width="100" height="2.6" fill="#C9D1DC" />
            </pattern>
          </defs>
          <path class="l" fill="#F4F1EA" d="M12 88V12h14.5L50 42.5V68L26.5 38.5V88Z" />
          <path class="r" fill="url(#boot-scan)" d="M88 88V12H73.5L50 42.5V68L73.5 38.5V88Z" />
          <line class="axis" x1="50" y1="2" x2="50" y2="14" stroke="#FF5A36" stroke-width="1.2" stroke-dasharray="2.4 2.4" />
          <line class="axis" x1="50" y1="72" x2="50" y2="98" stroke="#FF5A36" stroke-width="1.2" stroke-dasharray="2.4 2.4" />
          <circle class="dot" fill="#FF5A36" cx="50" cy="25" r="5.2" />
        </svg>
        <span class="word">Mirror<b>Actu</b></span>
      </div>
      <p class="tag">Today, reflected. Tomorrow, remembered.</p>
      <div class="bar" aria-hidden="true"><i></i></div>
    </div>
    <div id="root"></div>
    <noscript>MirrorActu needs JavaScript to load stories.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
