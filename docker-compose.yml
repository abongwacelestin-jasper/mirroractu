# MirrorActu: the public site, the staff dashboard, the API, the database and the cache.
#
#   docker compose up -d --build      start (or update) everything:
#                                       public site      http://localhost:8080
#                                       staff dashboard  http://localhost:8081   (a separate website)
#   docker compose up -d db api       just the API and database, for `npm run dev` (which proxies /api to :4000)
#   docker compose logs -f api        watch the API
#   docker compose down               stop it (data is kept)
#   docker compose down -v            stop it and delete the database
#
# The site, the dashboard and the API all run the SAME image. APP_TARGET says which one a
# container is. Settings come from a file named .env beside this one (copy deploy/env.example).

x-app: &app
  image: mirroractu:latest
  build:
    context: .
    args:
      VITE_SITE_URL: ${SITE_URL:-http://localhost:8080}
      VITE_ADSENSE_CLIENT: ${VITE_ADSENSE_CLIENT:-}
      VITE_ADSENSE_SLOT_LEADERBOARD: ${VITE_ADSENSE_SLOT_LEADERBOARD:-}
      VITE_ADSENSE_SLOT_MPU: ${VITE_ADSENSE_SLOT_MPU:-}
      VITE_ADSENSE_SLOT_HALFPAGE: ${VITE_ADSENSE_SLOT_HALFPAGE:-}
      VITE_ADSENSE_SLOT_INFEED: ${VITE_ADSENSE_SLOT_INFEED:-}
      VITE_IMA_AD_TAG: ${VITE_IMA_AD_TAG:-}
      VITE_GEO_ENDPOINT: ${VITE_GEO_ENDPOINT:-}
  restart: unless-stopped
  # No container needs write access or extra privileges.
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# The two websites write their nginx config at start-up; these folders must be writable by
# the nginx user (id 101), who is not root.
x-web-tmpfs: &web-tmpfs
  - /tmp
  - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
  - /etc/nginx/templates:uid=101,gid=101,mode=0755

services:
  # ---------- Database ----------
  db:
    image: postgres:16-alpine
    container_name: mirroractu-db
    environment:
      POSTGRES_USER: mirroractu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mirroractu-dev-only}
      POSTGRES_DB: mirroractu
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirroractu -d mirroractu"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Not published to the host: only the API can reach it.

  # ---------- Cache ----------
  redis:
    image: redis:7-alpine
    container_name: mirroractu-redis
    # A cache, not a store: capped in size, oldest entries dropped first, nothing written to disk.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Run as the image's own unprivileged "redis" user, so no extra privileges are needed.
    user: "999:1000"
    read_only: true
    tmpfs:
      - /data:uid=999,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Not published to the host: only the API can reach it.

  # ---------- API ----------
  api:
    <<: *app
    container_name: mirroractu-api
    environment:
      APP_TARGET: api
      PORT: "4000"
      DATABASE_URL: postgres://mirroractu:${POSTGRES_PASSWORD:-mirroractu-dev-only}@db:5432/mirroractu
      REDIS_URL: redis://redis:6379
      NODE_ENV: ${NODE_ENV:-development}
      SITE_ORIGIN: ${SITE_ORIGIN:-http://localhost:8080,http://localhost:5173}
      # The dashboard's address, and the key only its web server knows. See server/.env.example.
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:8081,http://localhost:5173}
      ADMIN_GATEWAY_KEY: ${ADMIN_GATEWAY_KEY:-}
      # Staff accounts, created automatically on every start.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      EDITOR_EMAILS: ${EDITOR_EMAILS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FORCE_RESET: ${ADMIN_FORCE_RESET:-}
      ANALYTICS_SALT: ${ANALYTICS_SALT:-dev-only-salt-change-me}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      LOGIN_MAX_FAILS: ${LOGIN_MAX_FAILS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      EVENTS_RETENTION_DAYS: ${EVENTS_RETENTION_DAYS:-90}
      SEED_CONTENT: ${SEED_CONTENT:-true}
      LOG_LEVEL: ${LOG_LEVEL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # For local development only (vite proxies /api here). Remove on a server.
      - "127.0.0.1:${API_PORT:-4000}:4000"
    tmpfs:
      - /tmp

  # ---------- Public website ----------
  web:
    <<: *app
    container_name: mirroractu
    environment:
      APP_TARGET: site
      API_UPSTREAM: http://api:4000
    depends_on:
      - api
    ports:
      # host:container. Change the left side to serve on another port, e.g. "80:8080".
      - "${PORT:-8080}:8080"
    tmpfs: *web-tmpfs

  # ---------- Staff dashboard: a separate website on its own port / address ----------
  admin:
    <<: *app
    container_name: mirroractu-admin
    environment:
      APP_TARGET: admin
      API_UPSTREAM: http://api:4000
      ADMIN_GATEWAY_KEY: ${ADMIN_GATEWAY_KEY:-}
    depends_on:
      - api
    ports:
      - "${ADMIN_PORT:-8081}:8080"
    tmpfs: *web-tmpfs

volumes:
  db-data:
